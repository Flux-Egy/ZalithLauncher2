name: PR CI

# Verification for pull requests (including forks): build one ABI, run unit tests,
# check 16 KB native alignment, and collect a lint report.
# Release builds are unchanged (see build.yml / release_ci.yml).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Deterministic toolchain inputs
  JAVA_VERSION: "21"
  CARGO_NDK_VERSION: "4.1.2"
  # SHA-256 of cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz
  # (matches the digest GitHub publishes for the release asset)
  CARGO_NDK_SHA256: "9451622c4567e8abb2c8005001855e32901c0b716ccdd3a173a4375fd03426e1"
  # NDK used by cargo-ndk for PetLib (ndk-build uses ndkVersion from build.gradle.kts).
  # Matches the NDK preinstalled on the current ubuntu runner image, which is what the
  # release workflow (build.yml) actually uses today; installed if a future image lacks it.
  CARGO_NDK_ANDROID_NDK: "30.0.16248370"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-01
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock', 'PetLib/rust/.cargo/config.toml') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk (checksum verified)
        run: |
          set -euo pipefail
          name="cargo-ndk-x86_64-unknown-linux-gnu-v${CARGO_NDK_VERSION}"
          url="https://github.com/bbqsrc/cargo-ndk/releases/download/v${CARGO_NDK_VERSION}/${name}.tgz"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$tmp/${name}.tgz" "$url"
          echo "${CARGO_NDK_SHA256}  $tmp/${name}.tgz" | sha256sum -c -
          tar xzf "$tmp/${name}.tgz" -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME"/.cargo/bin/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK for cargo-ndk (pinned)
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/${CARGO_NDK_ANDROID_NDK}"
          if [ ! -f "$ndk/source.properties" ]; then
            sdkmanager_bin="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
            # `yes` gets SIGPIPE when sdkmanager exits; keep that out of pipefail
            yes 2>/dev/null | "$sdkmanager_bin" --licenses > /dev/null || true
            "$sdkmanager_bin" --install "ndk;${CARGO_NDK_ANDROID_NDK}"
          fi
          test -f "$ndk/source.properties"
          echo "Using NDK at $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build debug APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:assembleDebug -Darch=arm64 --stacktrace

      - name: Unit tests
        run: >
          ./gradlew
          :ZalithLauncher:testDebugUnitTest
          :CardGrid:testDebugUnitTest
          :Guide:testDebugUnitTest
          -Darch=arm64 -PciExcludedTests --continue --stacktrace

      - name: Check 16 KB native library alignment
        run: |
          chmod +x scripts/check-16kb-alignment.sh
          scripts/check-16kb-alignment.sh \
            --allowlist .github/16kb-alignment-allowlist.txt \
            ZalithLauncher/build/outputs/apk/debug/*.apk

      # The bundled JREs ship as .tar.xz assets, so the APK check above cannot see their
      # libraries (libjvm.so etc.), which are extracted and dlopen()ed at runtime.
      # Report-only until 16 KB-aligned JREs are rebuilt upstream (docs/16kb-jre.md);
      # make it blocking once they land.
      - name: Check 16 KB alignment of bundled JREs (report only)
        continue-on-error: true
        run: |
          set -u
          status=0
          for jre in ZalithLauncher/src/main/assets/runtimes/jre-*; do
            for pair in arm64:arm64-v8a x86_64:x86_64; do
              archive="$jre/bin-${pair%%:*}.tar.xz"
              [ -f "$archive" ] || continue
              echo "### $(basename "$jre") ${pair##*:}" >> "$GITHUB_STEP_SUMMARY"
              scripts/check-16kb-alignment.sh --abi "${pair##*:}" "$archive" || status=1
            done
          done
          exit $status

      # Lint is report-only until a baseline is agreed; it does not fail the PR yet.
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew :ZalithLauncher:lintDebug -Darch=arm64

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-ci-reports
          path: |
            */build/reports/tests/
            */build/test-results/
            ZalithLauncher/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
